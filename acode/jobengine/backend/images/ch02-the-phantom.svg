<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" font-family="monospace">
  <rect width="800" height="200" fill="#1e1e1e" rx="12"/>
  <!-- Terminal -->
  <rect x="40" y="25" width="500" height="140" rx="8" fill="#0d0d0d" stroke="#333333" stroke-width="1"/>
  <circle cx="58" cy="42" r="5" fill="#ff5f57"/>
  <circle cx="74" cy="42" r="5" fill="#febc2e"/>
  <circle cx="90" cy="42" r="5" fill="#28c840"/>
  <text x="60" y="72" fill="#cccccc" font-size="11">SELECT id, status, updated_at FROM jobs WHERE status = 'RUNNING';</text>
  <text x="60" y="95" fill="#888888" font-size="11">id          │ status  │ updated_at</text>
  <text x="60" y="112" fill="#888888" font-size="11">────────────┼─────────┼──────────────────</text>

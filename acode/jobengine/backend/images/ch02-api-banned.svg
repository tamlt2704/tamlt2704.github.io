<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" font-family="monospace">
  <rect width="800" height="200" fill="#1e1e1e" rx="12"/>
  <!-- 5 threads -->
  <rect x="30" y="30" width="200" height="130" rx="8" fill="#252526" stroke="#3c3c3c" stroke-width="1"/>
  <text x="130" y="52" text-anchor="middle" fill="#cccccc" font-size="11">ShopZilla Workers</text>
  <text x="50" y="75" fill="#007acc" font-size="10">Thread 1 → API call</text>
  <text x="50" y="92" fill="#007acc" font-size="10">Thread 2 → API call</text>
  <text x="50" y="109" fill="#28c840" font-size="10">Thread 3 → API call</text>
  <text x="50" y="126" fill="#28c840" font-size="10">Thread 4 → API call</text>
  <text x="50" y="143" fill="#e6a700" font-size="10">Thread 5 → API call</text>
  <!-- Arrows -->
  <line x1="230" y1="95" x2="350" y2="95" stroke="#cccccc" stroke-width="1.5"/>
  <text x="290" y="88" text-anchor="middle" fill="#888888" font-size="9">5 concurrent</text>
  <!-- API -->
  <rect x="350" y="50" width="200" height="90" rx="8" fill="#3c1010" stroke="#ff5f57" stroke-width="2"/>
  <text x="450" y="78" text-anchor="middle" fill="#ff5f57" font-size="12">Exchange Rate API</text>
  <text x="450" y="98" text-anchor="middle" fill="#ff5f57" font-size="14" font-weight="bold">429 TOO MANY</text>
  <text x="450" y="118" text-anchor="middle" fill="#ff5f57" font-size="10">IP BANNED 🚫</text>
  <!-- Fix -->
  <rect x="590" y="50" width="180" height="90" rx="8" fill="#252526" stroke="#4ec9b0" stroke-width="1.5"/>
  <text x="680" y="78" text-anchor="middle" fill="#4ec9b0" font-size="11">Fix: Semaphore(2)</text>
  <text x="680" y="98" text-anchor="middle" fill="#888888" font-size="10">Max 2 concurrent</text>
  <text x="680" y="118" text-anchor="middle" fill="#888888" font-size="10">Others wait in line</text>
  <!-- Bottom -->
  <text x="400" y="180" text-anchor="middle" fill="#e6a700" font-size="10">Old Greg: "Told you about Semaphores."</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" font-family="monospace">
  <rect width="800" height="300" fill="#1e1e1e" rx="12"/>
  <!-- Old Greg -->
  <circle cx="160" cy="130" r="40" fill="#888888"/>
  <text x="160" y="135" text-anchor="middle" fill="#1e1e1e" font-size="28">🧓</text>
  <text x="160" y="195" text-anchor="middle" fill="#cccccc" font-size="13">Old Greg</text>
  <text x="160" y="210" text-anchor="middle" fill="#888888" font-size="10">Last PR merged: 2019</text>
  <!-- Speech bubble -->
  <rect x="240" y="60" width="380" height="90" rx="10" fill="#333333" stroke="#007acc" stroke-width="1.5"/>
  <polygon points="240,100 220,120 240,120" fill="#333333" stroke="#007acc" stroke-width="1.5"/>
  <text x="260" y="90" fill="#cccccc" font-size="14">"We need a proper job engine.</text>
  <text x="260" y="110" fill="#cccccc" font-size="14"> Start simple. We'll iterate."</text>
  <text x="260" y="135" fill="#4ec9b0" font-size="11">Translation: build it, I'll review it in 3 weeks</text>
  <!-- Intern -->
  <circle cx="680" cy="130" r="40" fill="#4ec9b0"/>
  <text x="680" y="125" text-anchor="middle" fill="#1e1e1e" font-size="22">💻</text>
  <text x="680" y="195" text-anchor="middle" fill="#cccccc" font-size="13">You</text>
  <!-- Thought bubble -->
  <rect x="560" y="200" width="240" height="35" rx="8" fill="#252526" stroke="#3c3c3c" stroke-width="1"/>
  <text x="580" y="222" fill="#888888" font-size="12">How hard can it be?</text>
  <!-- Bottom -->
  <text x="400" y="275" text-anchor="middle" fill="#888888" font-size="11">Narrator: it was very hard.</text>
</svg>

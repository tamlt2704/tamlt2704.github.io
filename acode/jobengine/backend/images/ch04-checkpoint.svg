<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 180" font-family="monospace">
  <rect width="800" height="180" fill="#1e1e1e" rx="12"/>
  <!-- Progress bar background -->
  <rect x="40" y="30" width="720" height="30" rx="6" fill="#252526" stroke="#3c3c3c" stroke-width="1"/>
  <!-- Progress filled -->
  <rect x="40" y="30" width="65" height="30" rx="6" fill="#007acc"/>
  <!-- Pause marker -->
  <line x1="105" y1="25" x2="105" y2="65" stroke="#e6a700" stroke-width="2"/>
  <text x="105" y="20" text-anchor="middle" fill="#e6a700" font-size="10">⏸ PAUSE</text>
  <text x="105" y="80" text-anchor="middle" fill="#e6a700" font-size="9">row 4,523</text>
  <!-- Checkpoint saved -->
  <rect x="60" y="95" width="200" height="30" rx="6" fill="#252526" stroke="#4ec9b0" stroke-width="1"/>
  <text x="160" y="115" text-anchor="middle" fill="#4ec9b0" font-size="10">💾 checkpoint: "row:4523"</text>
  <!-- Arrow -->
  <text x="310" y="115" text-anchor="middle" fill="#888888" font-size="16">→</text>
  <!-- Resume -->
  <rect x="350" y="95" width="200" height="30" rx="6" fill="#252526" stroke="#28c840" stroke-width="1"/>
  <text x="450" y="115" text-anchor="middle" fill="#28c840" font-size="10">▶ resume from row 4,524</text>
  <!-- Arrow -->
  <text x="600" y="115" text-anchor="middle" fill="#888888" font-size="16">→</text>
  <!-- Complete -->
  <rect x="640" y="95" width="130" height="30" rx="6" fill="#252526" stroke="#28c840" stroke-width="2"/>
  <text x="705" y="115" text-anchor="middle" fill="#28c840" font-size="10">✓ 50,000 rows</text>
  <!-- Bottom -->
  <text x="400" y="155" text-anchor="middle" fill="#888888" font-size="10">No duplicate rows. No restart. Just a bookmark.</text>
</svg>

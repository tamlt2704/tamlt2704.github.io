<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" font-family="monospace">
  <rect width="800" height="200" fill="#1e1e1e" rx="12"/>
  <text x="400" y="25" text-anchor="middle" fill="#cccccc" font-size="12">EXPONENTIAL BACKOFF — each retry waits longer</text>
  <!-- Timeline -->
  <line x1="60" y1="80" x2="740" y2="80" stroke="#3c3c3c" stroke-width="1"/>
  <!-- Attempt 1 -->
  <circle cx="100" cy="80" r="8" fill="#ff5f57"/>
  <text x="100" y="65" text-anchor="middle" fill="#ff5f57" font-size="10">FAIL</text>
  <text x="100" y="105" text-anchor="middle" fill="#888888" font-size="9">t=0s</text>
  <!-- Wait 2s -->
  <rect x="115" y="74" width="60" height="12" rx="3" fill="#252526" stroke="#e6a700" stroke-width="1"/>
  <text x="145" y="84" text-anchor="middle" fill="#e6a700" font-size="8">2s</text>
  <!-- Attempt 2 -->
  <circle cx="200" cy="80" r="8" fill="#ff5f57"/>
  <text x="200" y="65" text-anchor="middle" fill="#ff5f57" font-size="10">FAIL</text>
  <text x="200" y="105" text-anchor="middle" fill="#888888" font-size="9">t=2s</text>
  <!-- Wait 4s -->
  <rect x="215" y="74" width="110" height="12" rx="3" fill="#252526" stroke="#e6a700" stroke-width="1"/>
  <text x="270" y="84" text-anchor="middle" fill="#e6a700" font-size="8">4s</text>
  <!-- Attempt 3 -->
  <circle cx="350" cy="80" r="8" fill="#ff5f57"/>
  <text x="350" y="65" text-anchor="middle" fill="#ff5f57" font-size="10">FAIL</text>
  <text x="350" y="105" text-anchor="middle" fill="#888888" font-size="9">t=6s</text>
  <!-- Wait 8s -->
  <rect x="365" y="74" width="200" height="12" rx="3" fill="#252526" stroke="#e6a700" stroke-width="1"/>
  <text x="465" y="84" text-anchor="middle" fill="#e6a700" font-size="8">8s</text>
  <!-- Attempt 4: success -->
  <circle cx="590" cy="80" r="8" fill="#28c840"/>
  <text x="590" y="65" text-anchor="middle" fill="#28c840" font-size="10">OK ✓</text>
  <text x="590" y="105" text-anchor="middle" fill="#888888" font-size="9">t=14s</text>
  <!-- API comes back -->
  <rect x="540" y="120" width="200" height="30" rx="6" fill="#252526" stroke="#28c840" stroke-width="1"/>
  <text x="640" y="140" text-anchor="middle" fill="#28c840" font-size="10">API comes back online</text>
  <!-- Bottom -->
  <text x="400" y="175" text-anchor="middle" fill="#888888" font-size="10">2^attempt seconds: 2s → 4s → 8s → success</text>
  <text x="400" y="192" text-anchor="middle" fill="#4ec9b0" font-size="10">Add jitter to prevent thundering herd on recovery</text>
</svg>

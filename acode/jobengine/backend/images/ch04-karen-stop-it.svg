<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" font-family="monospace">
  <rect width="800" height="220" fill="#1e1e1e" rx="12"/>
  <!-- Karen running -->
  <circle cx="100" cy="90" r="40" fill="#ff6b6b"/>
  <text x="100" y="98" text-anchor="middle" fill="#1e1e1e" font-size="30">🏃‍♀️</text>
  <text x="100" y="150" text-anchor="middle" fill="#cccccc" font-size="11">Karen</text>
  <!-- Speech -->
  <rect x="170" y="40" width="280" height="50" rx="8" fill="#333333" stroke="#ff5f57" stroke-width="2"/>
  <polygon points="170,65 150,80 170,80" fill="#333333" stroke="#ff5f57" stroke-width="2"/>
  <text x="310" y="62" text-anchor="middle" fill="#ff5f57" font-size="16" font-weight="bold">STOP IT STOP IT STOP IT</text>
  <text x="310" y="80" text-anchor="middle" fill="#888888" font-size="10">Wrong file. 50,000 rows of 2025 data.</text>
  <!-- Counter -->
  <rect x="500" y="50" width="260" height="80" rx="8" fill="#0d0d0d" stroke="#e6a700" stroke-width="1"/>
  <text x="520" y="75" fill="#e6a700" font-size="12">Rows imported:</text>
  <text x="520" y="100" fill="#ff5f57" font-size="24" font-weight="bold">23,847 / 50,000</text>
  <text x="520" y="118" fill="#888888" font-size="10">and counting... no way to stop it</text>
  <!-- You -->
  <circle cx="680" cy="170" r="30" fill="#4ec9b0"/>
  <text x="680" y="178" text-anchor="middle" fill="#1e1e1e" font-size="22">😶</text>
  <text x="680" y="210" text-anchor="middle" fill="#888888" font-size="10">"I... can't."</text>
</svg>
